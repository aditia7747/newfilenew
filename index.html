<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader Royale - MP3 & MP4 Tanpa Watermark</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ========================================================
       1. COLOR VARIABLES (LIGHT & DARK NEOBRUTALISM PRO)
       ======================================================== */
    :root {
      /* Mode Default (Dark Neobrutalism) */
      --bg-color: #0E0E12;
      --bg-dot: #262633;
      --card-bg: #181820;
      --card-inner: #121217;
      --text-color: #FFFFFF;
      --text-muted: #9E9EAF;
      --border-color: #000000;
      --border-highlight: #343444;
      --shadow-color: #000000;
      
      /* Vibrant Neobrutal Accents */
      --primary-yellow: #FFE600;
      --accent-cyan: #00F0FF;
      --accent-pink: #FF3366;
      --accent-green: #00E676;
      --accent-purple: #9D4EDD;
      
      --border-thick: 3px;
      --shadow-size: 5px;
    }

    [data-theme="light"] {
      --bg-color: #FFFDF0;
      --bg-dot: #121212;
      --card-bg: #FFFFFF;
      --card-inner: #F5F5F7;
      --text-color: #121212;
      --text-muted: #666666;
      --border-color: #121212;
      --border-highlight: #121212;
      --shadow-color: #121212;
      
      --primary-yellow: #FFE600;
      --accent-cyan: #00F0FF;
      --accent-pink: #FF477E;
      --accent-green: #10B981;
      --accent-purple: #8B5CF6;
    }

    /* ========================================================
       2. RESET & BASE LAYOUT
       ======================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      min-height: 100vh;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      /* Neobrutalist Polka Grid */
      background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ========================================================
       3. TOP CONTROLS (THEME SWITCHER & BADGE)
       ======================================================== */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-pink);
      color: #FFFFFF;
      font-weight: 900;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 6px 12px;
      border: var(--border-thick) solid var(--border-color);
      border-radius: 50px;
      box-shadow: 3px 3px 0px var(--shadow-color);
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--primary-yellow);
      color: #000000;
      font-family: inherit;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      padding: 6px 12px;
      border: var(--border-thick) solid var(--border-color);
      border-radius: 10px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      cursor: pointer;
    }

    .theme-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    /* ========================================================
       4. HEADER SECTION
       ======================================================== */
    .header-title {
      font-size: 30px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: -0.5px;
      line-height: 1.2;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-title span {
      background: var(--accent-cyan);
      color: #000000;
      padding: 3px 10px;
      border: var(--border-thick) solid var(--border-color);
      border-radius: 10px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      transform: rotate(-1deg);
    }

    /* ========================================================
       5. MAIN NEOBRUTAL CARD
       ======================================================== */
    .neo-card {
      width: 100%;
      background: var(--card-bg);
      border: var(--border-thick) solid var(--border-color);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--shadow-size) var(--shadow-size) 0px var(--shadow-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-color);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .neo-input {
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-color);
      background: var(--card-inner);
      border: var(--border-thick) solid var(--border-color);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      outline: none;
    }

    .neo-input:focus {
      border-color: var(--border-color);
      box-shadow: 5px 5px 0px var(--shadow-color);
      transform: translate(-1px, -1px);
    }

    .neo-input::placeholder {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ========================================================
       6. BUTTONS & INTERACTION
       ======================================================== */
    .button-group {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .neo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 13px 16px;
      border: var(--border-thick) solid var(--border-color);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      cursor: pointer;
      color: #000000;
      user-select: none;
    }

    .neo-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--shadow-color);
    }

    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    .neo-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 3px 3px 0px var(--shadow-color) !important;
    }

    .btn-process {
      background: var(--primary-yellow);
    }

    .btn-reset {
      background: #FFFFFF;
      color: #000000;
    }

    /* ========================================================
       7. RESULT & DOWNLOAD SECTION
       ======================================================== */
    .status-box {
      margin-top: 18px;
      padding: 13px;
      border: var(--border-thick) solid var(--border-color);
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      animation: popIn 0.2s ease-out;
    }

    .status-box.loading {
      background: var(--accent-cyan);
      color: #000000;
    }

    .status-box.error {
      background: var(--accent-pink);
      color: #FFFFFF;
    }

    .result-container {
      margin-top: 20px;
      padding-top: 20px;
      border-top: var(--border-thick) dashed var(--border-color);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .preview-card {
      background: var(--card-inner);
      border: var(--border-thick) solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 3px 3px 0px var(--shadow-color);
      margin-bottom: 16px;
    }

    .cover-wrapper {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      margin-bottom: 10px;
    }

    .cover-img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }

    .author-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #000000;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1.5px solid #FFFFFF;
    }

    .video-title {
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      line-height: 1.4;
      color: var(--text-color);
      background: var(--card-bg);
      padding: 9px 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .download-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-mp4 {
      background: var(--accent-green);
      width: 100%;
    }

    .btn-mp3 {
      background: var(--accent-purple);
      color: #FFFFFF;
      width: 100%;
    }

    /* ========================================================
       8. DEVELOPER ONLY FOOTER
       ======================================================== */
    .neo-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: var(--border-thick) solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-inner);
      color: var(--text-color);
      border: var(--border-thick) solid var(--border-color);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 3px 3px 0px var(--shadow-color);
    }

    .dev-badge i {
      color: #EAB308;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="main-wrapper">
    <!-- Top Bar: Badge & Theme Switcher -->
    <div class="top-bar">
      <div class="top-badge">
        <i class="fa-solid fa-bolt"></i> Fast Downloader
      </div>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="Ganti Tema">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
        <span id="themeLabel">Light Mode</span>
      </button>
    </div>

    <!-- Header Title -->
    <h1 class="header-title">
      TikTok <span>Royale</span>
    </h1>

    <!-- Main Container -->
    <div class="neo-card">
      <div class="input-group">
        <label class="input-label" for="tiktokUrl">
          <i class="fa-solid fa-link"></i> Tempel URL TikTok:
        </label>
        <input 
          id="tiktokUrl" 
          class="neo-input" 
          type="text" 
          placeholder="https://www.tiktok.com/@..." 
          autocomplete="off"
        >
      </div>

      <div class="button-group">
        <button id="btnProcess" class="neo-btn btn-process" onclick="getTiktok()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Proses
        </button>
        <button class="neo-btn btn-reset" onclick="resetAll()">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>

      <!-- Result Target -->
      <div id="result"></div>

      <!-- Developer Info Footer (Sosmed dihapus) -->
      <div class="neo-footer">
        <div class="dev-badge">
          <i class="fa-solid fa-crown"></i>
          <span>Developer: <strong>Restu</strong></span>
          <i class="fa-solid fa-crown"></i>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State management
    let currentMedia = {
      videoUrl: '',
      musicUrl: '',
      title: ''
    };

    // --- 1. THEME SWITCHER LOGIC ---
    function initTheme() {
      const savedTheme = localStorage.getItem('app_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('app_theme', newTheme);
      updateThemeButtonUI(newTheme);
    }

    function updateThemeButtonUI(theme) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      
      if (theme === 'dark') {
        icon.className = 'fa-solid fa-sun';
        label.textContent = 'Light Mode';
      } else {
        icon.className = 'fa-solid fa-moon';
        label.textContent = 'Dark Mode';
      }
    }

    // Jalankan inisialisasi tema saat load
    initTheme();

    // --- 2. TIKTOK DOWNLOAD LOGIC ---
    async function getTiktok() {
      const input = document.getElementById("tiktokUrl");
      const result = document.getElementById("result");
      const btnProcess = document.getElementById("btnProcess");
      const url = input.value.trim();

      if (!url) {
        alert("Silakan masukkan URL TikTok terlebih dahulu!");
        input.focus();
        return;
      }

      // Tampilkan status proses
      btnProcess.disabled = true;
      result.innerHTML = `
        <div class="status-box loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <span>Sedang mengambil video...</span>
        </div>
      `;

      try {
        const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
        const response = await fetch(apiUrl);
        const json = await response.json();

        if (!json || json.code !== 0 || !json.data) {
          result.innerHTML = `
            <div class="status-box error">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span>Gagal! Pastikan video bersifat publik & link valid.</span>
            </div>
          `;
          btnProcess.disabled = false;
          return;
        }

        const data = json.data;
        const videoTitle = data.title || 'Video TikTok Royale';

        // Simpan tautan media
        currentMedia.videoUrl = data.play || data.wmplay || '';
        currentMedia.musicUrl = data.music || '';
        currentMedia.title = videoTitle.replace(/[\\/:*?"<>|]/g, '');

        const authorName = (data.author && data.author.unique_id) ? `@${data.author.unique_id}` : '@tiktok_user';
        const coverImg = data.cover || 'https://placehold.co/400x200?text=No+Cover';

        // Render tampilan hasil
        result.innerHTML = `
          <div class="result-container">
            <div class="preview-card">
              <div class="cover-wrapper">
                <img src="${coverImg}" alt="Thumbnail Video" class="cover-img">
                <div class="author-badge">
                  <i class="fa-brands fa-tiktok"></i> ${escapeHtml(authorName)}
                </div>
              </div>
              <div class="video-title">
                ${escapeHtml(videoTitle)}
              </div>
            </div>

            <div class="download-grid">
              <button class="neo-btn btn-mp4" onclick="downloadAction('video')">
                <i class="fa-solid fa-circle-arrow-down"></i> Unduh MP4 (No WM)
              </button>
              <button class="neo-btn btn-mp3" onclick="downloadAction('music')">
                <i class="fa-solid fa-music"></i> Unduh Musik MP3
              </button>
            </div>
          </div>
        `;
      } catch (err) {
        console.error("Fetch error:", err);
        result.innerHTML = `
          <div class="status-box error">
            <i class="fa-solid fa-circle-xmark"></i>
            <span>Gagal terhubung ke server. Coba beberapa saat lagi.</span>
          </div>
        `;
      } finally {
        btnProcess.disabled = false;
      }
    }

    function downloadAction(type) {
      const url = (type === 'video') ? currentMedia.videoUrl : currentMedia.musicUrl;
      const extension = (type === 'video') ? 'mp4' : 'mp3';
      const cleanFileName = `${currentMedia.title || 'TikTok_Download'}.${extension}`;

      if (!url) {
        alert("Tautan unduhan tidak tersedia.");
        return;
      }

      const a = document.createElement('a');
      a.href = url;
      a.download = cleanFileName;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function resetAll() {
      document.getElementById("tiktokUrl").value = "";
      document.getElementById("result").innerHTML = "";
      currentMedia = { videoUrl: '', musicUrl: '', title: '' };
      document.getElementById("tiktokUrl").focus();
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
