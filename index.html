<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Downloader Royale - MP3 & MP4 Tanpa Watermark</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100vh;
    touch-action: manipulation;
    overscroll-behavior: contain;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at 50% 20%, #06142e, #01010a 90%);
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(45deg, rgba(0,255,255,0.03) 0px, rgba(0,255,255,0.03) 1px, transparent 2px, transparent 4px);
    animation: moveGrid 10s linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: 200px 400px; }
  }

  .center-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    width: 100%;
    max-width: 450px;
    padding: 20px;
  }

  h1 {
    font-size: 30px;
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff, 0 0 30px #0077ff;
    letter-spacing: 1px;
    animation: glowText 2.5s infinite alternate;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  @keyframes glowText {
    from { text-shadow: 0 0 15px #00eaff, 0 0 25px #0077ff; }
    to { text-shadow: 0 0 25px #8f00ff, 0 0 45px #0077ff; }
  }

  .container {
    background: rgba(15, 20, 40, 0.8);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,255,255,0.15), inset 0 0 25px rgba(0,0,255,0.15);
    width: 100%;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,255,255,0.2);
  }

  input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,255,255,0.4);
    margin-bottom: 18px;
    outline: none;
    font-size: 15px;
    text-align: center;
    background: rgba(0,0,0,0.35);
    color: #00eaff;
    transition: 0.3s;
  }

  input:focus {
    box-shadow: 0 0 12px #00eaff;
  }

  button {
    background: linear-gradient(90deg, #0077ff, #8f00ff);
    border: none;
    padding: 12px 28px;
    border-radius: 12px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s ease;
    margin: 6px;
    box-shadow: 0 0 15px rgba(0,255,255,0.2);
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px #00eaff, 0 0 40px #8f00ff;
  }

  #result {
    margin-top: 25px;
  }

  .download-links button {
    display: inline-block;
    margin: 10px;
    padding: 11px 20px;
    background: linear-gradient(135deg, #8f00ff, #0077ff);
    color: white;
    border-radius: 12px;
    border: none;
    font-weight: bold;
    transition: 0.3s;
  }

  .download-links button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 12px #0077ff, 0 0 30px #8f00ff;
  }

  .loading {
    font-size: 16px;
    margin-top: 12px;
    color: #00eaff;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  .footer {
    margin-top: 25px;
    text-align: center;
    color: #8a8a8a;
    font-size: 13px;
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 15px;
  }

  .social-links a {
    text-decoration: none;
    font-size: 23px;
    transition: 0.3s;
  }

  .social-links a:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 10px #00eaff);
  }

  .social-links .fa-whatsapp { color: #25D366; }
  .social-links .fa-tiktok { color: #00f2ea; }
  .social-links .fa-instagram { color: #e4405f; }

  .developer {
    margin-top: 20px;
    font-size: 15px;
    color: #00eaff;
    font-weight: 600;
    text-shadow: 0 0 10px #00eaff, 0 0 20px #0077ff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .developer i.fa-crown {
    color: gold;
    font-size: 16px;
  }
</style>
</head>

<body>
  <div class="center-wrapper">
    <h1>TikTok Downloader</h1>

    <div class="container">
      <input id="tiktokUrl" type="text" placeholder=" Tempel link TikTok di sini...">
      <div>
        <button onclick="getTiktok()"><i class="fa-solid fa-wand-magic-sparkles"></i> Proses</button>
        <button onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>
      <div id="result"></div>

      <div class="footer">
        <div class="social-links">
          <a href="https://whatsapp.com/channel/0029VbBPHdnEVccOS12cD225" target="_blank"><i class="fab fa-whatsapp"></i></a>
          <a href="https://www.tiktok.com/@restu6699" target="_blank"><i class="fab fa-tiktok"></i></a>
          <a href="https://www.instagram.com/restuskibidi?igsh=NXNrbzhpaDJhMjZp" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <div class="developer">
          <i class="fa-solid fa-crown"></i>
          <span>Developer <strong>Restu</strong></span>
          <i class="fa-solid fa-crown"></i>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
    document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

    async function getTiktok() {
      const url = document.getElementById("tiktokUrl").value.trim();
      const result = document.getElementById("result");
      if (!url) return alert("Masukkan link TikTok dulu!");

      result.innerHTML = '<p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Download sedang diproses...</p>';

      try {
        const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
        const response = await fetch(apiUrl);
        const json = await response.json();

        if (!json.data) {
          result.innerHTML = '<p>Gagal mengambil data! Pastikan link TikTok benar.</p>';
          return;
        }

        const data = json.data;
        const videoUrl = data.play;
        const musicUrl = data.music;
        const cover = data.cover;
        const title = data.title || 'Video TikTok';

        result.innerHTML = `
          <div class="fade-in">
            <p><strong> Judul:</strong> ${title}</p>
            <img src="${cover}" width="100%" style="border-radius:10px; box-shadow:0 0 25px rgba(0,255,255,0.3);">
            <div class="download-links">
              <button onclick="downloadFile('${videoUrl}', '${title}.mp4')"><i class="fa-solid fa-video"></i> MP4 (No Watermark)</button>
              <button onclick="downloadFile('${musicUrl}', '${title}.mp3')"><i class="fa-solid fa-music"></i> MP3</button>
            </div>
          </div>
        `;
      } catch (e) {
        console.error(e);
        result.innerHTML = '<p>Terjadi kesalahan. Coba lagi nanti.</p>';
      }
    }

    function resetAll() {
      document.getElementById("tiktokUrl").value = "";
      document.getElementById("result").innerHTML = "";
    }

    function downloadFile(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
